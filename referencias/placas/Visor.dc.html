<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Uri &amp; Guada — Visor de fichas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500;600;700&amp;family=Courier+Prime:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
.mono{font-family:'Courier Prime',monospace}
.grain{position:absolute;inset:0;background-image:url('/textura/grano.png');pointer-events:none;mix-blend-mode:multiply;z-index:50}
.duo{position:relative;overflow:hidden}
.duo img{display:block;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.25) brightness(1.08);mix-blend-mode:multiply}
.track{position:absolute;top:44px;left:0;display:flex;gap:40px;transition:transform .75s cubic-bezier(.65,0,.2,1)}
.panel{flex:none;width:1180px;height:900px;border-radius:32px;overflow:hidden;position:relative;transition:transform .75s cubic-bezier(.65,0,.2,1),filter .75s,opacity .75s;transform-origin:50% 0}
.panel.off{transform:scale(.94);filter:blur(3px) saturate(.7);opacity:.55}
.nav{width:56px;height:56px;border-radius:50%;border:2px solid #EEE6D3;background:#141210;color:#EEE6D3;font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; background: #3A3631; overflow: hidden; font-family: 'Archivo Narrow', sans-serif">
<div class="grain" style="opacity: 0.4"></div>
<div class="track" style="transform: translateX({{x}}px)">
<sc-for list="{{fichas}}" as="f" hint-placeholder-count="8">
<button type="button" onClick="{{f.go}}" class="panel {{f.cls}}" aria-label="Función {{f.n}}: {{f.titulo}}" style="background: {{f.bg}}; color: #F4E9D6; border: 0; padding: 40px 70px 0; text-align: left; display: block; cursor: {{f.cursor}}">
<span class="mono" style="display: flex; align-items: center; gap: 18px; font-size: 13px; letter-spacing: 0.16em"><span>FUNCIÓN {{f.n}}</span><span style="flex: 1; height: 1px; background: #F4E9D6"></span><span>{{f.marca}}</span></span>
<span style="display: block; text-align: center; font-size: {{f.fs}}px; font-weight: 700; line-height: 0.86; letter-spacing: -0.03em; margin-top: 40px">{{f.titulo}}</span>
<span class="mono" style="display: block; text-align: center; font-size: 20px; margin-top: 10px">una idea para {{f.para}}</span>
<span class="duo" style="display: block; width: 960px; height: 520px; margin: 44px auto 0; border-radius: 40px; border: 3px solid #1B1916; background: {{f.color}}"><img src="{{f.img}}" alt="" style="object-position: {{f.pos}}"></span>
</button>
</sc-for>
</div>
<button type="button" aria-label="Cerrar" style="position: absolute; right: 26px; top: 20px; width: 48px; height: 48px; border-radius: 50%; border: 2px solid #EEE6D3; background: #141210; color: #EEE6D3; font-size: 22px; z-index: 5">✕</button>
<div style="position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); display: flex; align-items: center; gap: 16px; background: #141210; color: #EEE6D3; border-radius: 40px; padding: 8px; z-index: 5">
<button type="button" class="nav" onClick="{{prev}}" aria-label="Función anterior">←</button>
<span class="mono" style="font-size: 16px; letter-spacing: 0.14em; min-width: 92px; text-align: center">{{counter}}</span>
<button type="button" class="nav" onClick="{{next}}" aria-label="Próxima función">→</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"inicio":{"editor":"range","min":0,"max":7,"step":1,"default":3,"section":"Visor"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: props.inicio ?? 3 }; }
  renderVals() {
    const data = [
      { n: '01', titulo: 'ANDÁ PIDIENDO', marca: 'PEDIDOSYA', para: 'PedidosYa', bg: '#BA0101', color: '#EBA5B3', img: '/img/anda-pidiendo/hero-sillon.jpg', pos: '50% 30%', fs: 170 },
      { n: '02', titulo: 'MUCHA MERD', marca: 'EL OJO DE IBEROAMÉRICA', para: 'El Ojo de Iberoamérica', bg: '#1D6766', color: '#8EC8D2', img: '/img/mucha-merd/hero-pared-votar.jpg', pos: '50% 50%', fs: 170 },
      { n: '03', titulo: 'LA P#%! QUE TE PARIÓ', marca: 'AMNISTÍA INTERNACIONAL', para: 'Amnistía Internacional', bg: '#D9541E', color: '#E2662C', img: '/img/lpqtp/hero-soldado.jpg', pos: '50% 40%', fs: 130 },
      { n: '04', titulo: 'SPOTIFUCK', marca: 'SPOTIFY', para: 'Spotify', bg: '#1F5C3F', color: '#86AE76', img: '/img/spotifuck/hero-cama.jpg', pos: '50% 40%', fs: 170 },
      { n: '05', titulo: 'NO ME BAÑO', marca: 'DOVE MEN+CARE', para: 'Dove Men+Care', bg: '#24365C', color: '#8FA8CF', img: '/img/no-me-bano/hero-pared.jpg', pos: '50% 48%', fs: 170 },
      { n: '06', titulo: 'KAMASUTRA', marca: 'CENITAL', para: 'Cenital', bg: '#1B1916', color: '#F2D3BF', img: '/img/kamasutra/grafica-eeuu-china.jpg', pos: '50% 32%', fs: 170 },
      { n: '07', titulo: 'CÓD1GOS D3 R3UN10N', marca: 'JOHNNIE WALKER BLONDE', para: 'Johnnie Walker Blonde', bg: '#1F3A8A', color: '#EBC54C', img: '/img/codigos/hero-botella.jpg', pos: '70% 50%', fs: 130 },
      { n: '08', titulo: 'CLARI', marca: '★', para: 'ella', bg: '#5B3E96', color: '#BBA7D8', img: '/img/clari/hero-salto.jpg', pos: '55% 45%', fs: 170 }
    ];
    const i = this.state.i;
    const go = (k) => this.setState({ i: Math.max(0, Math.min(data.length - 1, k)) });
    const fichas = data.map((f, k) => Object.assign({}, f, {
      cls: k === i ? '' : 'off',
      cursor: k === i ? 'default' : 'pointer',
      go: () => go(k)
    }));
    return {
      fichas,
      x: 130 - i * 1220,
      counter: data[i].n + ' / 08',
      prev: () => go(i - 1),
      next: () => go(i + 1)
    };
  }
}
</script>
</body>
</html>
