<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Uri &amp; Guada — Cartelera</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500;600;700&amp;family=Courier+Prime:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Advercase';src:url('/fonts/Advercase-Regular.otf') format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Advercase';src:url('/fonts/Advercase-Bold.otf') format('opentype');font-weight:700;font-style:normal}
@font-face{font-family:'Roycella';src:url('/fonts/Roycella.ttf') format('truetype')}
body{margin:0}
a{color:#1B1916;text-decoration:none}a:hover{color:#BA0101}
.adv{font-family:'Advercase',Georgia,serif}
.roy{font-family:'Roycella',cursive;font-weight:400}
.mono{font-family:'Courier Prime',monospace}
.arch{font-family:'Archivo Narrow',sans-serif}
.grain{position:absolute;inset:0;background-image:url('/textura/grano.png');pointer-events:none;mix-blend-mode:multiply;z-index:50}
.duo img{filter:grayscale(1) contrast(1.25) brightness(1.08);mix-blend-mode:multiply}
.notch{-webkit-mask:radial-gradient(circle 16px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 16px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 16px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 16px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.barcode{background:repeating-linear-gradient(90deg,#1B1916 0 2px,#0000 2px 4px,#1B1916 4px 5px,#0000 5px 9px,#1B1916 9px 12px,#0000 12px 14px)}
.vert{writing-mode:vertical-rl;transform:rotate(180deg)}
</style>
</helmet>
<div class="arch" style="position: relative; width: 1440px; min-height: 2000px; background: #EEE6D3; color: #1B1916; overflow: hidden">
<div class="grain" style="opacity: {{grano}}"></div>
<header style="display: flex; align-items: center; justify-content: space-between; padding: 22px 80px; border-bottom: 2px solid #1B1916">
<a href="Main.dc.html" class="roy" style="font-size: 48px; line-height: 1">Uri &amp; Guada</a>
<nav style="display: flex; gap: 44px; font-size: 16px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase">
<a href="Cartelera.dc.html" aria-current="page" style="color: #BA0101; border-bottom: 2px solid #BA0101; padding-bottom: 4px">Cartelera</a>
<a href="Tierlist.dc.html">Tierlist</a>
<a href="Main.dc.html#contacto">Contacto</a>
</nav>
<a href="Main.dc.html#contacto" class="notch" style="background: #BA0101; color: #EEE6D3; padding: 15px 32px; font-weight: 700; letter-spacing: 0.14em; font-size: 14px">SACAR ENTRADA</a>
</header>

<section style="padding: 80px 80px 0">
<div class="adv" style="font-size: 200px; line-height: 0.8; letter-spacing: -0.02em; border-bottom: 2px solid #1B1916; padding-bottom: 36px">Cartelera</div>
</section>

<section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 64px 56px; padding: 72px 80px 120px">
<sc-for list="{{entradas}}" as="t" hint-placeholder-count="8">
<a href="Ficha.dc.html" class="notch" style="display: flex; height: 312px; transform: rotate({{t.rot}}deg); box-shadow: 0 16px 28px rgba(27,25,22,0.16); color: {{t.dark}}">
<div style="flex: 1; background: {{t.color}}; display: flex; gap: 26px; padding: 24px 24px 24px 36px">
<div class="{{t.frame}}" style="flex: none; width: 210px; height: 264px; background: {{t.bg}}; border: 6px solid #F6EEDC; box-sizing: border-box; overflow: hidden"><img src="{{t.img}}" alt="{{t.alt}}" style="display: block; width: 100%; height: 100%; object-fit: {{t.fit}}; object-position: {{t.pos}}"></div>
<div style="display: flex; flex-direction: column; flex: 1; min-width: 0">
<div class="mono" style="display: flex; justify-content: space-between; font-size: 13px; letter-spacing: 0.1em"><span>FUNCIÓN {{t.n}}</span><span>{{t.marca}}</span></div>
<div style="height: 2px; background: {{t.dark}}; margin: 10px 0 0"></div>
<div style="font-size: 58px; font-weight: 700; line-height: 0.88; letter-spacing: -0.01em; margin-top: auto">{{t.titulo}}</div>
</div>
</div>
<div style="width: 104px; background: #F6EEDC; border-left: 3px dashed {{t.dark}}; display: flex; flex-direction: column; align-items: center; padding: 22px 0; gap: 14px">
<div class="adv vert" style="font-size: 26px; flex: 1; white-space: nowrap">Uri &amp; Guada</div>
<div class="barcode" style="width: 56px; height: 34px"></div>
</div>
</a>
</sc-for>
</section>

<footer class="mono" style="background: #1B1916; color: #B9AF9C; padding: 28px 80px; font-size: 12px; letter-spacing: 0.14em">© URI &amp; GUADA</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"grano":{"editor":"range","min":0,"max":1,"step":0.05,"default":0.8,"section":"Textura"},"$preview":{"width":1440,"height":2000}}'>
class Component extends DCLogic {
  renderVals() {
    const entradas = [
      { n: '01', titulo: 'ANDÁ PIDIENDO', marca: 'PEDIDOSYA', color: '#EBA5B3', dark: '#7A1229', img: '/img/anda-pidiendo/hero-sillon.jpg', alt: 'Hombre dormido en el sillón', frame: 'duo', bg: '#EBA5B3', fit: 'cover', pos: '50% 30%', rot: -1 },
      { n: '02', titulo: 'MUCHA MERD', marca: 'EL OJO', color: '#8EC8D2', dark: '#0F4C57', img: '/img/mucha-merd/logo-vertical.jpg', alt: 'Logo de Mucha merd sobre plancha de corte', frame: 'duo', bg: '#8EC8D2', fit: 'cover', pos: '50% 60%', rot: 1 },
      { n: '03', titulo: 'LA P#%! QUE TE PARIÓ', marca: 'COUNTER-STRIKE 2', color: '#E2662C', dark: '#3E1303', img: '/img/lpqtp/hero-soldado.jpg', alt: 'Soldado de Counter-Strike disparando', frame: 'duo', bg: '#E2662C', fit: 'cover', pos: '50% 40%', rot: 1 },
      { n: '04', titulo: 'SPOTIFUCK', marca: 'SPOTIFY', color: '#86AE76', dark: '#1E3B16', img: '/img/spotifuck/pareja.jpg', alt: 'Pareja animada de Spotifuck', frame: 'duo', bg: '#86AE76', fit: 'cover', pos: '50% 40%', rot: -1 },
      { n: '05', titulo: 'NO ME BAÑO', marca: 'DOVE MEN+CARE', color: '#8FA8CF', dark: '#1C2D4F', img: '/img/no-me-bano/mural.jpg', alt: 'Mural No me baño de Dove Men+Care en un edificio', frame: 'duo', bg: '#8FA8CF', fit: 'cover', pos: '50% 50%', rot: -1 },
      { n: '06', titulo: 'KAMASUTRA', marca: 'CENITAL', color: '#D8C7A2', dark: '#6E0000', img: '/img/kamasutra/grafica-eeuu-china.jpg', alt: 'Gráfica Kamasutra para Cenital', frame: 'duo', bg: '#D8C7A2', fit: 'cover', pos: '50% 40%', rot: 1 },

  }
}
</script>
</body>
</html>
